<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Entrar - HerbWay</title>
  <link rel="shortcut icon" href="../images/plant-pot.svg">
  <link rel="stylesheet" href="../Public/login.css">
  <script src="../Scripts/login.js"></script>
</head>
<body>

  <header>
    <div class="logo">HerbWay</div>
    <nav>
      <a href="index.html" class="btn-home">Início</a>
      <a href="cadastro.html" class="btn-primary">Criar conta</a>
    </nav>
  </header>

  <div class="form-wrapper">
    <span class="tag">ACESSE SUA CONTA</span>
    <h2>Entrar na HerbWay</h2>
    <p class="subtitle">Entre para gerenciar anúncios ou avaliar profissionais.</p>

    <form action="#" method="post">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
      </div>

      <div class="form-group">
        <label for="senha">
          Senha
        </label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
      </div>

      <button type="submit" class="btn-primary btn-full">Entrar</button>
    </form>

    <p class="form-footer">Ainda não possui uma conta? <a href="cadastro.html">Cadastre-se</a></p>
  </div>

</body>
</html>
