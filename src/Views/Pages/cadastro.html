<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Criar conta - HerbWay</title>
  <link rel="stylesheet" href="../Public/cadastro.css">
  <link rel="shortcut icon" href="../images/plant-pot.svg">
  <script src="../Scripts/cadastro.js"></script>
</head>
<body>

  <header>
    <div class="logo">HerbWay</div>
    <nav>
      <a href="index.html" class="btn-home">Início</a>    
      <a href="login.html" class="btn-primary">Entrar</a>
    </nav>
  </header>

  <div class="form-wrapper">
    <span class="tag">CRIE SUA CONTA</span>
    <h2>Cadastre-se na HerbWay</h2>
    <p class="subtitle">Crie seu perfil para gerenciar anúncios ou avaliar profissionais.</p>

    <form action="#" method="post" novalidate>
      <div class="form-group">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
      </div>

      <div class="form-group">
        <label for="senha">
          Senha
        </label>
        <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
      </div>

      <div class="form-group">
        <label for="confirmar_senha">
          Confirmar senha
        </label>
        <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Repita a senha" required>
      </div>

      <button type="submit" class="btn-primary btn-full">Criar conta</button>
    </form>

    <p class="form-footer">Já possui uma conta? <a href="login.html">Entrar</a></p>
  </div>

</body>
</html>
